[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokequant"
version = "0.1.0"
description = "Watchlist deal scanner and inventory OS for Swedish Pokémon reselling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.30",
  "python-telegram-bot>=21.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
pokequant = "pokequant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokequant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
