<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PokeQuant{% endblock %}</title>
  <style>
    :root { --bg:#f6f3ee; --ink:#1c1917; --muted:#57534e; --line:#d6d3d1; --accent:#0f766e; }
    body { margin:0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { display:flex; gap:1rem; align-items:center; padding:1rem 1.5rem; border-bottom:1px solid var(--line); background:#fff; }
    header a { color:var(--muted); text-decoration:none; margin-right:1rem; }
    header a:hover { color:var(--accent); }
    main { padding:1.5rem; max-width:1100px; margin:0 auto; }
    h1,h2 { margin:0 0 .75rem; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .card { background:#fff; border:1px solid var(--line); padding:1rem; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th,td { border-bottom:1px solid var(--line); padding:.55rem .4rem; text-align:left; vertical-align:top; font-size:.95rem; }
    .ok { color:var(--accent); font-weight:600; }
    .bad { color:#b91c1c; font-weight:600; }
    form.inline { display:flex; gap:.4rem; flex-wrap:wrap; }
    button, .btn { background:var(--accent); color:#fff; border:0; padding:.4rem .7rem; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <strong>PokeQuant</strong>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/review">Review</a>
      <a href="/watchlist">Watchlist</a>
      <a href="/grade-targets">Grade targets</a>
      <a href="/centering">Centering</a>
      <a href="/inventory">Inventory</a>
      <a href="/precision">Precision</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
