services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokequant
      POSTGRES_PASSWORD: pokequant
      POSTGRES_DB: pokequant
    ports:
      - "5432:5432"
    volumes:
      - pokequant_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokequant -d pokequant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pokequant_pg:
